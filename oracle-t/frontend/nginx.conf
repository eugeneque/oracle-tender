# Отдача собранного фронтенда и проксирование API на backend.
#
# Фронтенд ходит в API относительным путём `/api/...` (см. src/api/client.ts), поэтому в
# продакшене всё живёт на одном origin: статика и API за одним и тем же nginx. Это убирает
# CORS как класс — в dev ту же роль играет proxy из vite.config.ts.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Логи в stdout/stderr контейнера — их видно в `docker compose logs frontend`.
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Хэш в имени файла делает содержимое неизменяемым — кэшируем надолго.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # React Router: все неизвестные пути отдаёт index.html, маршрут разбирает уже браузер.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Косая черта в конце proxy_pass срезает префикс /api — ровно как rewrite в vite.config.ts.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Загрузка документации тендеров — файлы бывают в десятки мегабайт, а разбор
        # архива с OCR внутри запроса занимает минуты: дефолтных 1m/60s не хватает.
        client_max_body_size 256m;
        proxy_read_timeout   600s;
        proxy_send_timeout   600s;
        proxy_buffering      off;
    }
}
